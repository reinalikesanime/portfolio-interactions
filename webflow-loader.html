<!--
  Installed in Webflow: Site Settings > Custom Code > Footer (before </body>).

  Live: loads the pinned commit (REF) from jsDelivr, checked with an integrity hash (SRI).
  To release: build, push, then update REF (commit id) and SRI (sha384 of dist/portfolio.js).

  Preview: load any pushed commit in your own browser only, without changing the live site.
    localStorage.setItem('pi-ref', '<commit id>')   // preview that commit
    localStorage.removeItem('pi-ref')               // back to live
  Visitors never have this flag set, so they always get the live version.
-->
<script>
  (function () {
    var REF = 'a08ebf06b294c147373c875d0d7193b67377a2f8'; // v0.2.2
    var SRI = 'sha384-j/BEKSYrz5P0JnJbz039cUdjKn3fEyTxF2lyWt49geRtJDh7Xz2F+a3liwsWMVaN';
    var preview = null;
    try { preview = localStorage.getItem('pi-ref'); } catch (e) {}
    if (preview && !/^[0-9a-f]{7,40}$/.test(preview)) preview = null;
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/gh/reinalikesanime/portfolio-interactions@' + (preview || REF) + '/dist/portfolio.js';
    s.crossOrigin = 'anonymous';
    if (!preview) s.integrity = SRI;
    else console.info('[portfolio] Preview mode: ' + preview);
    document.body.appendChild(s);
  })();
</script>
